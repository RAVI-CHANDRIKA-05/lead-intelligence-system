# config.yaml - Lead Intelligence System
# Rubric, scoring settings and LLM settings. Never put API keys in this file;
# read them from the LLM_API_KEY environment variable instead.

product: >
  Sales and customer data analytics platform: unifies CRM, transaction and
  engagement data so mid-market sales and marketing teams can see which
  customers and leads to prioritise.

ideal_customer: >
  Mid-market companies (about 50-5,000 employees) with large customer or lead
  volumes and a sales or marketing team. Strongest in retail, tech, marketing,
  media, gaming, finance and travel.

# One fixed date for every file, so results are reproducible. Never use today's date.
reference_date: "2024-01-20"

# Factor weights. Must add up to 1.0.
weights:
  source: 0.30
  size: 0.25
  recency: 0.25
  industry: 0.20

# Points out of 10 for each source. Match is case-insensitive.
source_scores:
  "Referral": 10
  "Inbound demo request": 9
  "Sales call": 7
  "Webinar attendee": 5
  "Content download": 3
  "LinkedIn outreach": 2
  missing_or_unknown: 5      # neutral score, lower confidence, flag for review

# Points out of 10 by company size (employees).
size_scores:
  bands:
    - {min: 1,     max: 1,     score: 1}
    - {min: 2,     max: 10,    score: 3}
    - {min: 11,    max: 50,    score: 6}
    - {min: 51,    max: 500,   score: 10}
    - {min: 501,   max: 5000,  score: 8}
    - {min: 5001,  max: 20000, score: 5}
    - {min: 20001, max: null,  score: 2}
  missing: 5                 # neutral score, lower confidence, flag for review

# Points out of 10 by days since last interaction (reference_date minus date).
recency_scores:
  bands:
    - {min: 0,   max: 14,   score: 10}
    - {min: 15,  max: 30,   score: 9}
    - {min: 31,  max: 60,   score: 7}
    - {min: 61,  max: 90,   score: 6}
    - {min: 91,  max: 180,  score: 4}
    - {min: 181, max: 365,  score: 3}
    - {min: 366, max: null, score: 1}
  missing: 5                 # neutral score, lower confidence, flag for review
  future_date:               # date after reference_date
    days_used: 0             # treat as 0 days old, never a negative number
    flag_for_review: true

# Cell values treated as missing (case-insensitive), before any date or size math.
missing_values: ["", "NA", "N/A", "NULL", "NONE", "NAN", "UNKNOWN", "-"]

# Industry groups, scored by how likely the group is to need the product.
# If an industry is in two groups (for example FinTech, EdTech), use the higher score.
industry_groups:
  tech:
    score: 10
    members: [SaaS, Software, Analytics, Cybersecurity, EdTech, FinTech, AI/ML, Cloud, IT Services]
  retail:
    score: 10
    members: [Retail, E-commerce, Consumer Goods]
  marketing_media:
    score: 9
    members: [Marketing, Media, Gaming, entertainment]
  finance:
    score: 9
    members: [Finance, FinTech, Insurance, Cryptocurrency, InsurTech]
  consumer_services:
    score: 8
    members: [Hospitality, Travel, Events, Services, Sports, Entertainment, HR Tech, Telecom]
  education:
    score: 7
    members: [Education, EdTech]
  real_estate_consulting:
    score: 7
    members: [Real Estate, Consulting]
  manufacturing:
    score: 6
    members: [Manufacturing, Logistics, Supply Chain, Automotive]
  healthcare:
    score: 6
    members: [Healthcare, Pharmaceuticals, Biotech, HealthTech]
  energy:
    score: 5
    members: [Energy]
  government_legal_agri:
    score: 4
    members: [Government, Legal, Agriculture]

# Industries not listed above: the LLM maps them to the nearest group above.
unlisted_industry:
  clear_match:               # e.g. "Online Retail" -> retail
    use_group_score: true    # full score of the matched group, no penalty
    flag_for_review: false
  uncertain_match:           # plausible group, but not obvious
    penalty: 1               # subtract this from the matched group's score
    confidence: low
    flag_for_review: false   # note only: the score still decides; a basic message is sent
  no_match:                  # nothing fits
    score: 5                 # neutral
    confidence: low
    flag_for_review: false   # note only: the score still decides; a basic message is sent
  record_mapping_in_reasoning: true

# Decision thresholds on the final 1-10 score.
# Set after scoring the 29 training leads (see README).
decision:
  qualified_min: 8.0         # at or above: qualified
  review_min: 6.5            # from here up to qualified_min: review; below: rejected
  low_confidence_to_review: true
  missing_key_field_to_review: true

# Priority rank for qualified leads: highest score first, ties broken by recency.
priority:
  rank_by: [score, recency]

# Who the messages come from.
sender:
  name: Chandrika
  company: Innova Solutions

# First-message settings. Messages are written for qualified leads only.
# Each message = greeting + opening sentence (from this file) + body (LLM) + sign-off.
messages:
  max_words: 80              # whole message: greeting, opening, body and sign-off
  tone: professional and concise
  product_name: analytics product   # used as {product} below
  call_to_action: "Would you be open to a 15-minute call this week?"
  call_to_action_soft: "Would it be useful if I shared more details?"
  value_proposition: >
    We help sales and marketing teams see which customers and leads to
    prioritise by unifying CRM, transaction and engagement data.
  product_link: ""           # optional: your product page URL. Used in LinkedIn (outreach_soft) messages only.
  link_sentence: "You can find an overview here: {link}"
  banned_phrases:            # if the LLM text contains any of these, the template is used instead
    - struggle
    - challenge
    - pain point
    - frustrat
    - workflow
    - your goals
    - your needs
    - often
    - typically
    - tend to
    - solve
    - recently          # no claims about when the product was launched or used
    - helped            # no claims that it has helped other companies
    - assisted
    - supported
    - launched
    - debuted
    - deployed
    - introduced
    - developed
    - built
    - empower
  default_variant: inbound_direct
  variant_by_source:         # which message style each lead source gets
    "Referral": referral_warm
    "Inbound demo request": inbound_direct
    "Sales call": inbound_direct
    "Webinar attendee": inbound_direct
    "Content download": inbound_direct
    "LinkedIn outreach": outreach_soft
  variant_guidance:
    referral_warm: >
      Warm and personal. Close with a question about a short call.
    inbound_direct: >
      Friendly and direct. Close with a question about a short call.
    outreach_soft: >
      Low pressure and curious. We are reaching out first, so do not assume they are
      interested. Close with a question offering to send more details.
  # The opening sentence is fixed by source, so the message always starts correctly.
  # {product} and {company} are filled in automatically.
  opening_sentences:
    "Referral": "You were referred to us by our mutual connection, so I wanted to reach out and introduce our {product}."
    "Inbound demo request": "Thank you for requesting a demo of our {product}."
    "Sales call": "Thank you for speaking with our team about our {product}."
    "Webinar attendee": "Thank you for attending our webinar and showing interest in our {product}."
    "Content download": "Thank you for downloading our content and showing interest in our {product}."
    "LinkedIn outreach": "I'm reaching out because {company} looks like a strong fit for our {product}."
  default_opening: "Thank you for your interest in our {product}."
  subjects:
    "Referral": "Introducing our {product} to {company}"
    "Inbound demo request": "Connecting regarding a demo of our {product}"
    "Sales call": "Following up on our call about our {product}"
    "Webinar attendee": "Following up on our webinar and our {product}"
    "Content download": "Thank you for your interest in our {product}"
    "LinkedIn outreach": "A quick introduction to our {product} for {company}"
  default_subject: "Our {product} for {company}"
  subject_no_company: "Introducing our {product}"   # used when the lead has no company name

# LLM call settings (Gemini API via Google AI Studio).
# The API key is read from the LLM_API_KEY environment variable or a .env file.
llm:
  provider: gemini
  model: gemini-3.5-flash-lite   # run `python main.py --list-models` if this name stops working
  api_base: https://generativelanguage.googleapis.com/v1beta
  batch_size: 10             # leads per API call
  temperature: 0.2           # scoring: low, so results stay consistent
  message_temperature: 0.7   # messages: higher, so they read differently
  max_retries: 5             # retries after the first attempt (rate limits, timeouts, bad output)
  backoff_seconds: 5         # wait doubles each retry: 5, 10, 20, 40, 80
  timeout_seconds: 90
  pause_between_batches_seconds: 3